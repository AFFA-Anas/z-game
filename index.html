<!DOCTYPE html>
<html>
<head>
  <title>Firebase Auth Game</title>
  <script src="https://www.gstatic.com/firebasejs/10.5.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.5.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.5.0/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.5.0/firebase-functions-compat.js"></script>
</head>
<body>
  <h1 id="yourNumber">Your Number: -</h1>
  <h1 id="opponentNumber">Opponent's Number: -</h1>
  <button onclick="generateNumber()">Generate Number</button>

  <script>
    // ?? Replace with your Firebase config
    const firebaseConfig = {
      apiKey: "AIzaSyDaHiA8qZIin9Vh3TDsmb4Qp9wW3oOEAQw",
      authDomain: "z-ggame.firebaseapp.com",
      databaseURL: "https://z-ggame-default-rtdb.firebaseio.com/",
      projectId: "z-ggame",
      storageBucket: "z-ggame.firebasestorage.app",
      messagingSenderId: "96114095227",
      appId: "1:96114095227:web:f90baf6aa3c86acdee9ede",
      measurementId: "G-0PM64J227W"
    };

    firebase.initializeApp(firebaseConfig);
	const db = firebase.database();

	let currentUid = null;
	let currentGameId = null;
	let opponentNumbersOff = null; // store detach function

	// Step 1: Sign in anonymously
	firebase.auth().signOut().then(() => {
	  firebase.auth().signInAnonymously().then(() => {
		currentUid = firebase.auth().currentUser.uid;
		console.log("Signed in anonymously as", currentUid);

		// Step 2: Add to lobby
		db.ref("lobby/" + currentUid).set({
		  joinedAt: Date.now()
		});
		db.ref("lobby/" + currentUid).onDisconnect().remove();

		// Step 3: Watch for my current game pointer
		const myPointerRef = db.ref(`userCurrentGame/${currentUid}`);
		myPointerRef.on("value", (snap) => {
		  const val = snap.val();
		  console.log("userCurrentGame:", val);
		  if (!val || !val.gameId) return;

		  if (currentGameId !== val.gameId) {
			currentGameId = val.gameId;
			console.log("Joined game:", currentGameId);

			// Start listening for last numbers in this game
			attachLastNumberListeners(currentGameId);
		  }
		}, (err) => {
		  console.error("userCurrentGame read error:", err);
		});
	  }).catch(console.error);
	});

	// Step 4: Attach listeners for last generated numbers
	function attachLastNumberListeners(gameId) {
	  // My last number
	  const myLastRef = db
		.ref(`games/${gameId}/players/${currentUid}/numbers`)
		.orderByChild("createdAt")
		.limitToLast(1);

	  myLastRef.on("child_added", (snap) => {
		const { number } = snap.val() || {};
		if (number !== undefined) {
		  document.getElementById("yourNumber").innerText = "Your Number: " + number;
		}
	  }, (err) => console.error("my numbers error:", err));

	  // Watch opponent
	  const playersRef = db.ref(`games/${gameId}/players`);
	  playersRef.on("value", (psnap) => {
		const players = psnap.val() || {};
		const opponentId = Object.keys(players).find((id) => id !== currentUid);
		if (!opponentId) return;

		// Detach previous opponent listener if any
		if (typeof opponentNumbersOff === "function") {
		  opponentNumbersOff();
		  opponentNumbersOff = null;
		}

		const oppLastRef = db
		  .ref(`games/${gameId}/players/${opponentId}/numbers`)
		  .orderByChild("createdAt")
		  .limitToLast(1);

		const onOppChildAdded = (snap) => {
		  const { number } = snap.val() || {};
		  if (number !== undefined) {
			document.getElementById("opponentNumber").innerText =
			  "Opponent's Number: " + number;
		  }
		};
		const onOppError = (err) => console.error("opponent numbers error:", err);

		oppLastRef.on("child_added", onOppChildAdded, onOppError);

		// Store detach function
		opponentNumbersOff = () => oppLastRef.off("child_added", onOppChildAdded);
	  }, (err) => console.error("players read error:", err));
	}

	// Step 5: Call backend to generate number
	async function generateNumber() {
	  const user = firebase.auth().currentUser;
	  if (!user) {
		console.error("User not signed in");
		return;
	  }
	  const idToken = await user.getIdToken();

	  const response = await fetch(
		"https://us-central1-z-ggame.cloudfunctions.net/generateNumber",
		{
		  method: "POST",
		  headers: {
			"Content-Type": "application/json",
			"Authorization": "Bearer " + idToken
		  }
		}
	  );

	  if (!response.ok) {
		const errorText = await response.text();
		console.error("Failed:", errorText);
		return;
	  }

	  const data = await response.json();
	  console.log("Server response:", data);
	}
  </script>
</body>
</html>
